
name: Build Hostel Friend Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22 (required by Capacitor CLI with TypeScript 7)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore debug signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing Android debug keystore secret"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Sync Capacitor Android
        env:
          CI: 'true'
        run: bun run cap:sync:android

      - name: Verify Android Firebase and Capacitor plugin configuration
        run: |
          test -s android/app/google-services.json || { echo "Missing android/app/google-services.json"; exit 1; }
          grep -q "rgcfaIncludeGoogle = true" android/variables.gradle || { echo "Missing rgcfaIncludeGoogle = true"; exit 1; }
          grep -q "androidxCredentialsVersion = '1.3.0'" android/variables.gradle || { echo "Missing androidxCredentialsVersion"; exit 1; }
          grep -q "capacitor-firebase-authentication" android/capacitor.settings.gradle || { echo "Missing :capacitor-firebase-authentication in capacitor.settings.gradle"; exit 1; }
          grep -q "capacitor-firebase-authentication" android/app/capacitor.build.gradle || { echo "Missing :capacitor-firebase-authentication in capacitor.build.gradle"; exit 1; }
          grep -q "FirebaseAuthenticationPlugin" android/app/src/main/assets/capacitor.plugins.json || { echo "Missing FirebaseAuthenticationPlugin in capacitor.plugins.json"; exit 1; }
          grep -q "google.com" android/app/src/main/assets/capacitor.config.json || { echo "Missing google.com provider in capacitor.config.json"; exit 1; }

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify FirebaseAuthentication plugin is packaged in APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          unzip -q "$APK" 'assets/capacitor.plugins.json' 'assets/capacitor.config.json' 'classes*.dex' -d "$VERIFY_DIR"
          grep -q "FirebaseAuthenticationPlugin" "$VERIFY_DIR/assets/capacitor.plugins.json" || { echo "APK missing FirebaseAuthenticationPlugin in capacitor.plugins.json"; exit 1; }
          grep -q "google.com" "$VERIFY_DIR/assets/capacitor.config.json" || { echo "APK missing google.com in capacitor.config.json"; exit 1; }
          grep -qa "Lio/capawesome/capacitorjs/plugins/firebase/authentication/FirebaseAuthenticationPlugin;" "$VERIFY_DIR"/classes*.dex || { echo "APK DEX missing FirebaseAuthenticationPlugin"; exit 1; }
          grep -qa "Landroidx/credentials/CredentialManager;" "$VERIFY_DIR"/classes*.dex || { echo "APK DEX missing CredentialManager (rgcfaIncludeGoogle)"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump strings "$APK" > "$VERIFY_DIR/strings.txt"
          grep -q "default_web_client_id" "$VERIFY_DIR/strings.txt" || { echo "APK missing default_web_client_id from google-services.json"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hostel-Friend-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
