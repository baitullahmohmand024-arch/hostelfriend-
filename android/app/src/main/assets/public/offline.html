<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0C" />
    <title>Offline — Hostel Friend</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: #0a0a0c;
        color: #f8f9fa;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: #151519;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 28px;
        text-align: center;
      }
      .logo {
        width: 68px;
        height: 68px;
        border-radius: 16px;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.55;
        color: #a1a1aa;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        color: #ffffff;
        background: linear-gradient(135deg, #00c8ff 0%, #8b35ff 100%);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="Hostel Friend" class="logo" />
      <h1>You are offline</h1>
      <p>
        Hostel Friend requires an active internet connection to load live posts, photos, messages,
        and Firebase sign-in. Cached app screens remain ready as soon as you reconnect.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
